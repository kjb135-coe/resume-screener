[project]
name = "resume-screener"
version = "0.1.0"
description = "Multi-agent resume screening pipeline exposed as an MCP server, a web API, and a CLI over one shared core."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "mcp>=2.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer>=0.13.0",
    "duckdb>=1.1.0",
    "pydantic>=2.9.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]
local = [
    "ollama>=0.4.0",
]
# Only scripts/build_resume_pdfs.py needs this, and only once.
pdf = [
    "reportlab>=4.0.0",
]

[project.scripts]
resume-screener = "resume_screener.adapters.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_screener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
