<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resume Screener</title>
<style>
  :root {
    --bg: #ffffff; --fg: #16181d; --muted: #5d6470; --line: #dfe3ea;
    --panel: #f6f8fa; --accent: #2f5bd0; --err: #b3261e;
    --advance: #1a7f4b; --hold: #9a6b00; --reject: #b3261e;
    --advance-bg: #e6f4ec; --hold-bg: #fbf1da; --reject-bg: #fbe9e7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a; --fg: #e7e9ee; --muted: #99a1af; --line: #2a2f3a;
      --panel: #1a1d25; --accent: #7d9bf0; --err: #f2857c;
      --advance: #4ad18b; --hold: #e0b23c; --reject: #f2857c;
      --advance-bg: #102b1e; --hold-bg: #2d2411; --reject-bg: #2e1714;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    border-bottom: 1px solid var(--line); padding: 14px 22px;
    display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 700; }
  nav { display: flex; gap: 4px; }
  nav button {
    background: none; border: 0; border-radius: 7px; padding: 6px 13px;
    font-size: 14px; color: var(--muted); cursor: pointer;
  }
  nav button[aria-selected="true"] { background: var(--panel); color: var(--fg); font-weight: 600; }
  .runmeta { margin-left: auto; font-size: 12.5px; color: var(--muted); }

  main { padding: 22px; max-width: 1400px; margin: 0 auto; }
  [hidden] { display: none !important; }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .stat {
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 15px;
    background: var(--panel); min-width: 108px;
  }
  .stat b { display: block; font-size: 20px; line-height: 1.25; }
  .stat span { font-size: 11.5px; color: var(--muted); }

  .filters { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters button {
    border: 1px solid var(--line); background: var(--bg); color: var(--muted);
    border-radius: 999px; padding: 5px 14px; font-size: 13px; cursor: pointer;
  }
  .filters button[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  }

  .split { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }

  .list { border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
  .row {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    padding: 11px 14px; background: var(--bg); border: 0;
    border-bottom: 1px solid var(--line); cursor: pointer; color: var(--fg); font: inherit;
  }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--panel); }
  .row[aria-current="true"] { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); }
  .row .who { flex: 1; min-width: 0; }
  .row .nm { font-weight: 600; font-size: 14px; }
  .row .arch { font-size: 11.5px; color: var(--muted); text-transform: capitalize; }
  .row .sc { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; }

  .pill {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
    padding: 3px 8px; border-radius: 999px; white-space: nowrap;
  }
  .pill.advance { background: var(--advance-bg); color: var(--advance); }
  .pill.hold    { background: var(--hold-bg);    color: var(--hold); }
  .pill.reject  { background: var(--reject-bg);  color: var(--reject); }
  .flag { font-size: 13px; color: var(--hold); }

  .detail { border: 1px solid var(--line); border-radius: 11px; padding: 20px 22px; background: var(--panel); }
  .detail h2 { margin: 0 0 3px; font-size: 20px; }
  .detail .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; text-transform: capitalize; }
  .headline { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .headline .big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .truth { font-size: 12px; color: var(--muted); }

  .notice {
    border-left: 3px solid var(--hold); background: var(--hold-bg); color: var(--fg);
    padding: 10px 13px; border-radius: 0 7px 7px 0; font-size: 13.5px; margin-bottom: 16px;
  }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
       margin: 20px 0 9px; font-weight: 700; }
  .agent { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
           margin-bottom: 9px; background: var(--bg); }
  .agent .top { display: flex; align-items: baseline; gap: 9px; margin-bottom: 5px; flex-wrap: wrap; }
  .agent code { font-size: 12px; color: var(--muted); }
  .agent .n { font-weight: 700; font-variant-numeric: tabular-nums; }
  .agent .conf { font-size: 11.5px; color: var(--muted); }
  .agent p { margin: 0; font-size: 13.5px; }
  .bad { color: var(--err); font-size: 11.5px; font-weight: 600; }
  blockquote { margin: 0; padding: 11px 14px; border-left: 3px solid var(--accent);
               background: var(--bg); border-radius: 0 7px 7px 0; font-size: 13.5px;
               white-space: pre-wrap; }
  details.resume { margin-top: 20px; }
  details.resume summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre.resume {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px;
    overflow-x: auto; font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; margin-top: 10px;
  }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  textarea {
    width: 100%; min-height: 210px; padding: 13px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg);
    font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical;
  }
  .go { display: flex; align-items: center; gap: 13px; margin-top: 13px; }
  .go button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 19px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .go button:disabled { opacity: .55; cursor: default; }
  .status { color: var(--muted); font-size: 13px; }
  .status.error { color: var(--err); }
  .dim { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px;
         padding: 15px 17px; margin-bottom: 13px; background: var(--panel); }
  .dim h4 { margin: 0 0 3px; font-size: 15px; }
  .lens { border-top: 1px dashed var(--line); margin-top: 11px; padding-top: 10px; font-size: 13.5px; }
  .lens b { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase;
            letter-spacing: .5px; margin-bottom: 3px; }
</style>
</head>
<body>

<header>
  <h1>Resume Screener</h1>
  <nav>
    <button id="tab-results" aria-selected="true">Candidates</button>
    <button id="tab-rubric" aria-selected="false">Rubric</button>
  </nav>
  <div class="runmeta" id="runmeta"></div>
</header>

<main>
  <!-- ================= CANDIDATES ================= -->
  <section id="view-results">
    <div class="stats" id="stats"></div>
    <div class="filters" id="filters"></div>
    <div class="split">
      <div class="list" id="list"></div>
      <div id="detail"></div>
    </div>
  </section>

  <!-- ================= RUBRIC ================= -->
  <section id="view-rubric" hidden>
    <p style="margin-top:0;color:var(--muted)">
      Paste any job posting. The panel's scoring rubric is written from it —
      nothing is hardcoded to one role. This makes a live API call.
    </p>
    <textarea id="jd" placeholder="Paste the full job posting here…" spellcheck="false"></textarea>
    <div class="go">
      <button id="gen">Generate rubric</button>
      <span class="status" id="status"></span>
    </div>
    <div id="rubric-out" hidden>
      <h2 id="role" style="margin-bottom:4px"></h2>
      <p class="sub" id="summary" style="color:var(--muted)"></p>
      <div id="dims"></div>
      <details><summary style="cursor:pointer;color:var(--muted);font-size:13px">Rubric as the panel receives it</summary>
        <pre class="resume" id="md"></pre></details>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const FILTERS = [
  ["all", "All"], ["advance", "Advance"], ["hold", "Hold"],
  ["reject", "Reject"], ["review", "Needs review"],
];
let DATA = null;
let filter = "all";
let selected = null;

/* ---------- tabs ---------- */
function showTab(which) {
  const results = which === "results";
  $("view-results").hidden = !results;
  $("view-rubric").hidden = results;
  $("tab-results").setAttribute("aria-selected", String(results));
  $("tab-rubric").setAttribute("aria-selected", String(!results));
}
$("tab-results").addEventListener("click", () => showTab("results"));
$("tab-rubric").addEventListener("click", () => showTab("rubric"));

/* ---------- candidates ---------- */
function visible() {
  if (!DATA) return [];
  if (filter === "all") return DATA.candidates;
  if (filter === "review") return DATA.candidates.filter((c) => c.needs_human_review);
  return DATA.candidates.filter((c) => c.recommendation === filter);
}

function renderStats() {
  const s = DATA.summary;
  $("stats").replaceChildren(...[
    [s.advance, "Advance"], [s.hold, "Hold"], [s.reject, "Reject"],
    [s.needs_human_review, "Need a human"], [s.n, "Screened"],
  ].map(([n, label]) => {
    const d = document.createElement("div");
    d.className = "stat";
    const b = document.createElement("b"); b.textContent = n;
    const sp = document.createElement("span"); sp.textContent = label;
    d.append(b, sp);
    return d;
  }));
  $("runmeta").textContent =
    `recorded run · macro-F1 ${s.macro_f1} · $${s.cost_total} for ${s.n} · p50 ${s.latency_p50}s`;
}

function renderFilters() {
  $("filters").replaceChildren(...FILTERS.map(([key, label]) => {
    const b = document.createElement("button");
    const n = key === "all" ? DATA.candidates.length
            : key === "review" ? DATA.summary.needs_human_review
            : DATA.summary[key];
    b.textContent = `${label} (${n})`;
    b.setAttribute("aria-pressed", String(filter === key));
    b.addEventListener("click", () => { filter = key; renderList(); renderFilters(); });
    return b;
  }));
}

function renderList() {
  const rows = visible();
  if (!rows.length) {
    $("list").replaceChildren(Object.assign(document.createElement("div"),
      { className: "empty", textContent: "No candidates in this group." }));
    return;
  }
  $("list").replaceChildren(...rows.map((c) => {
    const b = document.createElement("button");
    b.className = "row";
    b.setAttribute("aria-current", String(selected === c.file));

    const who = document.createElement("div"); who.className = "who";
    const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = c.name;
    const ar = document.createElement("div"); ar.className = "arch";
    ar.textContent = c.archetype.replace(/_/g, " ");
    who.append(nm, ar);

    const sc = document.createElement("span"); sc.className = "sc";
    sc.textContent = c.score.toFixed(1);
    const pill = document.createElement("span");
    pill.className = `pill ${c.recommendation}`; pill.textContent = c.recommendation;

    b.append(who, sc, pill);
    if (c.needs_human_review) {
      const f = document.createElement("span");
      f.className = "flag"; f.textContent = "⚑"; f.title = c.review_reason;
      b.append(f);
    }
    b.addEventListener("click", () => { selected = c.file; renderList(); renderDetail(c); });
    return b;
  }));
}

function renderDetail(c) {
  const el = $("detail");
  el.className = "detail";
  el.replaceChildren();

  const h = document.createElement("h2"); h.textContent = c.name;
  const sub = document.createElement("p"); sub.className = "sub";
  sub.textContent = c.archetype.replace(/_/g, " ");

  const head = document.createElement("div"); head.className = "headline";
  const big = document.createElement("span"); big.className = "big";
  big.textContent = `${c.score.toFixed(1)} / 10`;
  const pill = document.createElement("span");
  pill.className = `pill ${c.recommendation}`; pill.textContent = c.recommendation;
  const truth = document.createElement("span"); truth.className = "truth";
  truth.textContent = c.matches_ground_truth
    ? `matches ground truth (${c.expected})`
    : `⚠ ground truth says ${c.expected}`;
  head.append(big, pill, truth);
  el.append(h, sub, head);

  if (c.needs_human_review) {
    const n = document.createElement("div"); n.className = "notice";
    n.textContent = c.review_reason;
    el.append(n);
  }

  const ph = document.createElement("h3");
  ph.textContent = `Panel — 3 agents, spread ${c.panel_spread.toFixed(1)}`;
  el.append(ph);
  for (const a of c.panel) {
    const box = document.createElement("div"); box.className = "agent";
    const top = document.createElement("div"); top.className = "top";
    const n = document.createElement("span"); n.className = "n"; n.textContent = a.score.toFixed(1);
    const code = document.createElement("code"); code.textContent = a.agent;
    const conf = document.createElement("span"); conf.className = "conf";
    conf.textContent = `confidence ${a.confidence.toFixed(2)}`;
    top.append(n, code, conf);
    if (a.parse_failed) {
      const bad = document.createElement("span");
      bad.className = "bad"; bad.textContent = "UNREADABLE RESPONSE";
      top.append(bad);
    }
    const p = document.createElement("p"); p.textContent = a.rationale;
    box.append(top, p);
    el.append(box);
  }

  const rh = document.createElement("h3");
  rh.textContent = c.escalated ? "Arbiter ruling" : "Combined reasoning";
  const q = document.createElement("blockquote"); q.textContent = c.rationale;
  el.append(rh, q);

  const det = document.createElement("details"); det.className = "resume";
  const sm = document.createElement("summary"); sm.textContent = "Full resume";
  const pre = document.createElement("pre"); pre.className = "resume";
  pre.textContent = c.resume_text || "(resume file not found)";
  det.append(sm, pre);
  el.append(det);
}

function emptyDetail() {
  $("detail").className = "";
  $("detail").replaceChildren(Object.assign(document.createElement("div"),
    { className: "empty", textContent: "Select a candidate to see the panel's reasoning." }));
}

async function loadResults() {
  const res = await fetch("/api/results");
  const body = await res.json();
  if (!res.ok) {
    $("list").replaceChildren(Object.assign(document.createElement("div"),
      { className: "empty", textContent: body.error || "Could not load results." }));
    return;
  }
  DATA = body;
  renderStats(); renderFilters(); renderList(); emptyDetail();
}

/* ---------- rubric ---------- */
function renderRubric(data) {
  $("role").textContent = data.role_title;
  $("summary").textContent = data.summary;
  $("md").textContent = data.markdown;
  $("dims").replaceChildren(...data.dimensions.map((d, i) => {
    const el = document.createElement("div"); el.className = "dim";
    const h = document.createElement("h4"); h.textContent = `${i + 1}. ${d.title}`;
    const code = document.createElement("code"); code.textContent = d.name;
    const cr = document.createElement("p"); cr.textContent = d.criteria;
    const lens = document.createElement("div"); lens.className = "lens";
    const b = document.createElement("b"); b.textContent = "Agent brief";
    const t = document.createElement("span"); t.textContent = d.lens;
    lens.append(b, t);
    el.append(h, code, cr, lens);
    return el;
  }));
  $("rubric-out").hidden = false;
}

async function generate() {
  const jd = $("jd").value.trim();
  if (!jd) { $("status").textContent = "Paste a job posting first."; $("status").className = "status error"; return; }
  $("gen").disabled = true;
  $("rubric-out").hidden = true;
  $("status").className = "status";
  $("status").textContent = "Writing the rubric… this takes a few seconds.";
  try {
    const res = await fetch("/api/rubric", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ job_description: jd }),
    });
    const data = await res.json();
    if (!res.ok) {
      $("status").textContent = data.error || `Request failed (${res.status}).`;
      $("status").className = "status error";
      return;
    }
    renderRubric(data);
    $("status").textContent = "";
  } catch (err) {
    $("status").textContent = `Could not reach the server: ${err.message}`;
    $("status").className = "status error";
  } finally {
    $("gen").disabled = false;
  }
}
$("gen").addEventListener("click", generate);
$("jd").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") generate();
});

loadResults();
</script>
</body>
</html>
